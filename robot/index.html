<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,"><title>手机机器人</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee}
header{padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input,button,select{font-size:15px;padding:6px;border-radius:6px;border:0}
button.on{background:#2a2;color:#fff}
#stage{position:relative;width:100%;height:40vh;background:#000;touch-action:none}
#v,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#mode{position:absolute;left:8px;top:6px;font-weight:bold;text-shadow:0 0 3px #000}
#pad{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center;margin:8px}
#pad button{height:64px;font-size:26px;background:#2d6cdf;color:#fff}
#pad .s{background:#d33}
#log{height:20vh;overflow:auto;padding:8px;font-size:14px;background:#1c1c1c}
.tag{padding:3px 8px;border-radius:10px;background:#444}
.mock{display:none}.mockon .mock{display:flex}
</style></head><body>
<header>
 <button id="bleConn" style="font-size:18px;padding:10px 16px;background:#1a7;color:#fff;font-weight:bold">连接小车（蓝牙）</button>
 <span id="st" class="tag">未连接</span>
 速度<input id="spd" type="range" min="80" max="255" value="160"><span id="spdv">160</span>
 <details style="font-size:13px"><summary>高级：Wi‑Fi</summary>
  <input id="host" placeholder="ESP32 地址" size="12">
  <button id="conn">WebSocket 连接</button>
 </details>
</header>
<p id="bleWarn" style="display:none;margin:0 8px;padding:8px;background:#622;border-radius:8px;font-size:14px"></p>
<header>
 <select id="facing"><option value="environment">后置摄像头</option><option value="user">前置摄像头</option></select>
 <button id="cam">开启摄像头</button>
 <button id="follow">跟随：关</button>
 <label><input type="checkbox" id="mock">模拟模式</label>
 <span id="det" class="tag">无人</span>
</header>
<header class="mock">模拟人：拖动画面上的框移动；距离<input id="mockH" type="range" min="10" max="100" value="40">
 <label><input type="checkbox" id="mockVis" checked>人在画面</label></header>
<header>
 <button id="talk">🎤 按一下说话</button>
 <button id="cont">持续听：关</button>
 <input id="txt" placeholder="或输入指令/聊天" size="12"><button id="send">发送</button>
 <button id="cfgBtn">设置</button>
</header>
<div id="stage"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="mode">手动</div></div>
<div id="pad">
 <span></span><button data-c="F">▲</button><span></span>
 <button data-c="L">◀</button><button data-c="S" class="s">■</button><button data-c="R">▶</button>
 <span></span><button data-c="B">▼</button><span></span>
</div>
<div id="log"></div>
<dialog id="cfg"><form method="dialog">
 <p>大模型（OpenAI 兼容接口）<select id="preset">
  <option value="https://api.deepseek.com/v1|deepseek-chat">DeepSeek</option>
  <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-turbo">通义千问</option>
  <option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI</option>
 </select></p>
 <p>Base URL <input id="base" size="30"></p>
 <p>模型 <input id="model"></p>
 <p>API Key <input id="key" type="password" placeholder="sk-..."></p>
 <p>唤醒词（留空=关闭）<input id="wake" placeholder="例如：小车" size="8"></p>
 <p style="font-size:12px">设置只保存在本机浏览器。“停”不需要唤醒词。</p>
 <button id="save">保存</button>
</form></dialog>
<script type="module" src="app.js"></script>
</body></html>
